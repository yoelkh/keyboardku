<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="KeyboardKu architecture: a single-thread input pipeline on the phone feeds two transports, Bluetooth HID and encrypted UDP, which reach Windows through the HID class driver or a small Rust server calling SendInput">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a97ad"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fa3ff"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5fd3b3"/>
    </marker>
    <style>
      .t { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .b { font-size: 14px; font-weight: 600; fill: #ffffff; }
      .s { font-size: 12px; fill: #b9c3d6; }
      .box { fill: #141c2e; stroke: #2d3b58; stroke-width: 1.5; }
      .wire { fill: none; stroke: #8a97ad; stroke-width: 1.6; }
      .flowB { stroke-dasharray: 8 10; animation: f 1.4s linear infinite; }
      .flowG { stroke-dasharray: 8 10; animation: f 1.4s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .flowB, .flowG { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="600" rx="20" fill="#0c1220"/>

  <!-- PHONE -->
  <g class="t">
    <rect x="30" y="30" width="520" height="540" rx="18" fill="#0f1729" stroke="#2d3b58" stroke-width="1.5"/>
    <text x="54" y="64" class="h">Android phone</text>
    <text x="54" y="84" class="s">one thread from touch to radio · no allocation in the hot path</text>

    <!-- sources -->
    <g>
      <rect class="box" x="54" y="106" width="146" height="66" rx="10"/>
      <text x="127" y="134" text-anchor="middle" class="b">Trackpad view</text>
      <text x="127" y="154" text-anchor="middle" class="s">unbuffered touch</text>

      <rect class="box" x="217" y="106" width="146" height="66" rx="10"/>
      <text x="290" y="134" text-anchor="middle" class="b">System keyboard</text>
      <text x="290" y="154" text-anchor="middle" class="s">IME bridge + key bar</text>

      <rect class="box" x="380" y="106" width="146" height="66" rx="10"/>
      <text x="453" y="134" text-anchor="middle" class="b">Gyroscope</text>
      <text x="453" y="154" text-anchor="middle" class="s">200 Hz, no batching</text>
    </g>

    <!-- engines -->
    <g>
      <rect class="box" x="54" y="212" width="146" height="66" rx="10"/>
      <text x="127" y="240" text-anchor="middle" class="b">Gesture engine</text>
      <text x="127" y="260" text-anchor="middle" class="s">accel curve in mm/s</text>

      <rect class="box" x="217" y="212" width="146" height="66" rx="10"/>
      <text x="290" y="240" text-anchor="middle" class="b">Keyboard state</text>
      <text x="290" y="260" text-anchor="middle" class="s">full HID-style states</text>

      <rect class="box" x="380" y="212" width="146" height="66" rx="10"/>
      <text x="453" y="240" text-anchor="middle" class="b">Air-mouse engine</text>
      <text x="453" y="260" text-anchor="middle" class="s">player-space gyro</text>
    </g>
    <path class="wire" d="M127 172 V210" marker-end="url(#arr)"/>
    <path class="wire" d="M290 172 V210" marker-end="url(#arr)"/>
    <path class="wire" d="M453 172 V210" marker-end="url(#arr)"/>

    <!-- scheduler -->
    <rect x="54" y="320" width="472" height="70" rx="10" fill="#16233d" stroke="#3b5a94" stroke-width="1.5"/>
    <text x="290" y="349" text-anchor="middle" class="b">Report scheduler</text>
    <text x="290" y="370" text-anchor="middle" class="s">coalesces motion · carries sub-pixel remainder · flushes before clicks and keys</text>
    <path class="wire" d="M127 278 V318" marker-end="url(#arr)"/>
    <path class="wire" d="M290 278 V318" marker-end="url(#arr)"/>
    <path class="wire" d="M453 278 V318" marker-end="url(#arr)"/>

    <!-- transports -->
    <rect x="54" y="436" width="224" height="106" rx="10" fill="#0f2a2a" stroke="#199e70" stroke-width="1.8"/>
    <text x="166" y="466" text-anchor="middle" class="b">UDP transport</text>
    <text x="166" y="488" text-anchor="middle" class="s">32-byte ChaCha20-Poly1305 packets</text>
    <text x="166" y="507" text-anchor="middle" class="s">cumulative counters, full key states</text>
    <text x="166" y="526" text-anchor="middle" class="s">discovery on every interface</text>

    <rect x="302" y="436" width="224" height="106" rx="10" fill="#122544" stroke="#3987e5" stroke-width="1.8"/>
    <text x="414" y="466" text-anchor="middle" class="b">Bluetooth HID transport</text>
    <text x="414" y="488" text-anchor="middle" class="s">keyboard + 16-bit mouse + media</text>
    <text x="414" y="507" text-anchor="middle" class="s">one report per 6 ms sniff anchor</text>
    <text x="414" y="526" text-anchor="middle" class="s">phone-initiated pairing</text>

    <path class="wire" d="M166 390 V434" marker-end="url(#arr)"/>
    <path class="wire" d="M414 390 V434" marker-end="url(#arr)"/>
  </g>

  <!-- LINKS -->
  <g class="t">
    <path class="flowB" d="M526 470 C 640 470, 600 190, 698 190" fill="none" stroke="#4fa3ff" stroke-width="2.6" marker-end="url(#arrB)"/>
    <path class="flowG" d="M166 542 V548 Q166 558 176 558 H590 C 660 558, 640 420, 698 420" fill="none" stroke="#5fd3b3" stroke-width="2.6" marker-end="url(#arrG)"/>
    <rect x="556" y="290" width="124" height="26" rx="13" fill="#0c1220" stroke="#3987e5"/>
    <text x="618" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#cfe1ff">Bluetooth Classic</text>
    <rect x="566" y="498" width="132" height="26" rx="13" fill="#0c1220" stroke="#199e70"/>
    <text x="632" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#c9f3e6">WiFi · USB · hotspot</text>
  </g>

  <!-- LAPTOP -->
  <g class="t">
    <rect x="700" y="30" width="470" height="540" rx="18" fill="#0f1729" stroke="#2d3b58" stroke-width="1.5"/>
    <text x="724" y="64" class="h">Windows 11 laptop</text>
    <text x="724" y="84" class="s">nothing to install for Bluetooth · one small exe for WiFi</text>

    <rect x="724" y="130" width="422" height="120" rx="10" fill="#122544" stroke="#3987e5" stroke-width="1.8"/>
    <text x="935" y="164" text-anchor="middle" class="b">Built-in HID class driver</text>
    <text x="935" y="188" text-anchor="middle" class="s">the phone enumerates as "HID Keyboard Device"</text>
    <text x="935" y="207" text-anchor="middle" class="s">and "HID-compliant mouse", like real hardware</text>
    <text x="935" y="230" text-anchor="middle" class="s">works at the lock screen and in UAC prompts</text>

    <rect x="724" y="330" width="422" height="180" rx="10" fill="#0f2a2a" stroke="#199e70" stroke-width="1.8"/>
    <text x="935" y="362" text-anchor="middle" class="b">keyboardku-server (Rust)</text>
    <text x="935" y="386" text-anchor="middle" class="s">single-threaded UDP loop, no heap use after start-up</text>
    <text x="935" y="405" text-anchor="middle" class="s">pairing code → stored key → per-session keys, replay window</text>
    <text x="935" y="424" text-anchor="middle" class="s">SendInput: absolute-from-delta motion, scancode keys,</text>
    <text x="935" y="443" text-anchor="middle" class="s">host-side key repeat, Unicode text</text>
    <text x="935" y="466" text-anchor="middle" class="s">watchdog releases every held key within 500 ms of link loss</text>
    <text x="935" y="489" text-anchor="middle" class="s">opts out of Windows 11 efficiency-mode throttling</text>
  </g>
</svg>
