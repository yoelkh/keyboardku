<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="KeyboardKu app screen with callouts: status bar with connection state and round-trip time, trackpad area with gestures, special keys bar, and left and right mouse buttons">
  <style>
    .t { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ch { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .cs { font-size: 13px; fill: #b9c3d6; }
    .k { font-size: 11px; font-weight: 600; fill: #ffffff; }
    .lead { stroke: #4b5a78; stroke-width: 1.5; fill: none; }
    .dot { fill: #4fa3ff; }
    .tap { animation: tap 2.4s ease-out infinite; transform-origin: 500px 300px; }
    @keyframes tap { 0% { opacity: 0.9; transform: scale(0.4); } 70%,100% { opacity: 0; transform: scale(1.8); } }
    @media (prefers-reduced-motion: reduce) { .tap { animation: none; opacity: 0.4; } }
  </style>

  <rect width="1000" height="640" rx="20" fill="#0c1220"/>

  <!-- phone -->
  <g class="t">
    <rect x="370" y="30" width="260" height="580" rx="34" fill="#000000" stroke="#3b4a66" stroke-width="3"/>
    <rect x="470" y="42" width="60" height="10" rx="5" fill="#141c2e"/>

    <!-- status bar -->
    <text x="388" y="85" font-size="11.5" font-weight="700" fill="#66bb6a">Bluetooth · connected</text>
    <text x="388" y="101" font-size="10" fill="#9e9e9e">LAPTOP · RTT 9 ms</text>
    <g>
      <rect x="520" y="72" width="24" height="24" rx="6" fill="#1f1f1f"/><text x="532" y="89" text-anchor="middle" class="k">⌨</text>
      <rect x="548" y="72" width="24" height="24" rx="6" fill="#1e88e5"/><text x="560" y="89" text-anchor="middle" class="k">↗</text>
      <rect x="576" y="72" width="38" height="24" rx="6" fill="#1f1f1f"/><text x="595" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Pair</text>
    </g>

    <!-- trackpad -->
    <rect x="384" y="112" width="232" height="388" rx="14" fill="#000000" stroke="#333333" stroke-width="1.5"/>
    <circle class="tap" cx="500" cy="300" r="26" fill="none" stroke="#4fa3ff" stroke-width="2.5"/>
    <circle cx="500" cy="300" r="9" fill="#4fa3ff"/>
    <path d="M500 300 C 530 270, 552 262, 574 232" fill="none" stroke="#4fa3ff" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>

    <!-- keys bar -->
    <g>
      <rect x="384" y="510" width="34" height="26" rx="6" fill="#1f1f1f"/><text x="401" y="527" text-anchor="middle" class="k">Esc</text>
      <rect x="422" y="510" width="34" height="26" rx="6" fill="#1f1f1f"/><text x="439" y="527" text-anchor="middle" class="k">Tab</text>
      <rect x="460" y="510" width="34" height="26" rx="6" fill="#1e88e5"/><text x="477" y="527" text-anchor="middle" class="k">Ctrl</text>
      <rect x="498" y="510" width="34" height="26" rx="6" fill="#1f1f1f"/><text x="515" y="527" text-anchor="middle" class="k">Alt</text>
      <rect x="536" y="510" width="38" height="26" rx="6" fill="#e53935"/><text x="555" y="527" text-anchor="middle" class="k">Shift</text>
      <rect x="578" y="510" width="38" height="26" rx="6" fill="#1f1f1f"/><text x="597" y="527" text-anchor="middle" class="k">Win</text>
    </g>
    <!-- mouse buttons -->
    <rect x="384" y="546" width="114" height="40" rx="9" fill="#161616"/><text x="441" y="571" text-anchor="middle" font-size="12" fill="#ffffff">Left</text>
    <rect x="502" y="546" width="114" height="40" rx="9" fill="#161616"/><text x="559" y="571" text-anchor="middle" font-size="12" fill="#ffffff">Right</text>
  </g>

  <!-- callouts left -->
  <g class="t">
    <path class="lead" d="M384 86 H320"/><circle class="dot" cx="384" cy="86" r="4"/>
    <text x="40" y="78" class="ch">Live connection status</text>
    <text x="40" y="98" class="cs">transport, state and round-trip time;</text>
    <text x="40" y="116" class="cs">falls back to WiFi by itself</text>

    <path class="lead" d="M384 300 H320"/><circle class="dot" cx="384" cy="300" r="4"/>
    <text x="40" y="262" class="ch">Trackpad gestures</text>
    <text x="40" y="282" class="cs">tap to click · tap-and-drag</text>
    <text x="40" y="300" class="cs">two fingers to scroll or right-click</text>
    <text x="40" y="318" class="cs">three-finger tap for middle click</text>
    <text x="40" y="336" class="cs">speed-aware pointer acceleration</text>

    <path class="lead" d="M384 566 H320"/><circle class="dot" cx="384" cy="566" r="4"/>
    <text x="40" y="558" class="ch">Hold-to-drag buttons</text>
    <text x="40" y="578" class="cs">keep one pressed, move with the other hand</text>
  </g>

  <!-- callouts right -->
  <g class="t">
    <path class="lead" d="M560 72 V60 H680"/><circle class="dot" cx="560" cy="72" r="4"/>
    <text x="690" y="78" class="ch">Keyboard and air-mouse</text>
    <text x="690" y="98" class="cs">⌨ opens your own keyboard app;</text>
    <text x="690" y="116" class="cs">↗ steers the cursor by moving the phone</text>

    <path class="lead" d="M616 232 H680"/><circle class="dot" cx="616" cy="232" r="4"/>
    <text x="690" y="224" class="ch">Pure black, dims when idle</text>
    <text x="690" y="244" class="cs">nothing is drawn during a gesture and</text>
    <text x="690" y="262" class="cs">nothing is sent while you are not touching</text>

    <path class="lead" d="M616 523 H680"/><circle class="dot" cx="616" cy="523" r="4"/>
    <text x="690" y="506" class="ch">Special keys</text>
    <text x="690" y="526" class="cs">tap a modifier for one shot (blue),</text>
    <text x="690" y="544" class="cs">long-press to lock it (red);</text>
    <text x="690" y="562" class="cs">arrows, F-keys and media keys scroll sideways</text>
  </g>
</svg>
