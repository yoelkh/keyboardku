[package]
name = "keyboardku-server"
version = "0.1.0"
edition = "2021"
default-run = "keyboardku-server"
description = "KeyboardKu Windows host: receives encrypted UDP input from the phone and injects it with SendInput"

[[bin]]
name = "keyboardku-server"
path = "src/main.rs"

[[bin]]
name = "testclient"
path = "src/bin/testclient.rs"

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_Security_Cryptography",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
